# Smoke test with the test bot on every push to main (and by hand): Claude
# answers one prompt, and the repo's own MCP server (tg_send) delivers it to
# the test chat; then the real daemon answers one message on each OS.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN, TELEGRAM_TEST_BOT_TOKEN, TELEGRAM_TEST_CHAT_ID.
name: Telegram smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Telegram allows one poller per bot, so runs from quick successive pushes
# wait their turn instead of overlapping.
concurrency:
  group: telegram-test-bot
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test bot sends through tg_send
        run: |
          node .github/smoke/telegram-smoke.js "🧪 <b>CI smoke test</b> · run #${{ github.run_number }} · <code>${GITHUB_SHA::7}</code> · ${{ runner.os }}"$'\n'"tg_send from <code>mcp/telegram-tg.js</code> works."

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude answers one prompt
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          answer=$(claude -p "Reply with one short friendly sentence confirming you are running in GitHub Actions. Plain text only." --max-turns 1)
          echo "$answer"
          answer=$(printf '%s' "$answer" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          node .github/smoke/telegram-smoke.js "🤖 <b>Claude in CI</b> · $(claude --version)"$'\n'"$answer"

  # The real task daemon on each OS: fresh-install setup, one message through
  # its inbox file, Claude answers in the test chat. One OS at a time, since
  # Telegram allows only one poller per bot.
  daemon:
    needs: smoke
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The daemon spawns claude.exe directly on Windows (claude.cmd would go through cmd.exe).
      - name: Point the daemon at claude.exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          exe="$(npm root -g)/@anthropic-ai/claude-code/bin/claude.exe"
          ls -la "$exe"
          echo "CLAUDE_EXECUTABLE=$(cygpath -w "$exe")" >> "$GITHUB_ENV"

      - name: Daemon answers one message
        shell: bash
        run: node .github/smoke/daemon-e2e.js "${{ runner.os }} ${GITHUB_SHA::7}"
