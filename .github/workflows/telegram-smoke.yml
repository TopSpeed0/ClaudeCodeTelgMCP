# Manual smoke test with the test bot: Claude answers one prompt, and the
# repo's own MCP server (tg_send) delivers it to the test chat.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN, TELEGRAM_TEST_BOT_TOKEN, TELEGRAM_TEST_CHAT_ID.
name: Telegram smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test bot sends through tg_send
        run: |
          node .github/smoke/telegram-smoke.js "🧪 <b>CI smoke test</b> · run #${{ github.run_number }} · ${{ runner.os }}"$'\n'"tg_send from <code>mcp/telegram-tg.js</code> works."

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude answers one prompt
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          answer=$(claude -p "Reply with one short friendly sentence confirming you are running in GitHub Actions. Plain text only." --max-turns 1)
          echo "$answer"
          answer=$(printf '%s' "$answer" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          node .github/smoke/telegram-smoke.js "🤖 <b>Claude in CI</b> · $(claude --version)"$'\n'"$answer"
